name: hijinks-sglang-wheel-build

on:
  workflow_dispatch:
  push:
    branches:
      - spark/hijinks-024-diffusiongemma-upstream-rebase
    paths:
      - ".github/workflows/hijinks-sglang-wheel-build.yml"
      - "python/**"
      - "rust/**"
      - "README.md"
      - "LICENSE"

permissions:
  contents: read

jobs:
  wheel:
    name: Build SGLang wheel on persistent runner
    runs-on: [self-hosted, Linux, X64, ubicloud-persistent-build-x64, sglang-wheel]
    timeout-minutes: 45
    env:
      CCACHE_DIR: /opt/build-cache/ccache
      CCACHE_MAXSIZE: 100G
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Runner inventory
        run: |
          set -euxo pipefail
          hostname
          nproc
          free -h
          df -h / /opt/build-cache || true
          python3 --version
          nvcc --version || true
          ccache --show-config | grep -E 'cache_dir|max_size' || true

      - name: Prepare persistent build caches
        run: |
          set -euxo pipefail
          CACHE_ROOT="$HOME/.cache/hijinks-build"
          mkdir -p "$CACHE_ROOT/cargo" "$CACHE_ROOT/rustup" "$CACHE_ROOT/pip"
          echo "CARGO_HOME=$CACHE_ROOT/cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$CACHE_ROOT/rustup" >> "$GITHUB_ENV"
          echo "PIP_CACHE_DIR=$CACHE_ROOT/pip" >> "$GITHUB_ENV"
          echo "$CACHE_ROOT/cargo/bin" >> "$GITHUB_PATH"
          test -d "$CCACHE_DIR"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install protoc
        run: |
          set -euxo pipefail
          PROTOC_ROOT="$HOME/.cache/hijinks-build/protoc"
          if [ ! -x "$PROTOC_ROOT/bin/protoc" ]; then
            ARCH="$(uname -m)"
            if [ "$ARCH" = "aarch64" ] || [ "$ARCH" = "arm64" ]; then
              PROTOC_ARCH="aarch_64"
            else
              PROTOC_ARCH="x86_64"
            fi
            PROTOC_ZIP="protoc-32.0-linux-${PROTOC_ARCH}.zip"
            TMP_ZIP="/tmp/${PROTOC_ZIP}"
            rm -rf "$PROTOC_ROOT"
            mkdir -p "$PROTOC_ROOT"
            curl -L --retry 5 --fail \
              "https://github.com/protocolbuffers/protobuf/releases/download/v32.0/${PROTOC_ZIP}" \
              -o "$TMP_ZIP"
            python3 -m zipfile -e "$TMP_ZIP" "$PROTOC_ROOT"
            chmod +x "$PROTOC_ROOT/bin/protoc"
            rm -f "$TMP_ZIP"
          fi
          echo "$PROTOC_ROOT/bin" >> "$GITHUB_PATH"
          "$PROTOC_ROOT/bin/protoc" --version

      - name: Build wheel
        run: |
          set -euxo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install build wheel setuptools setuptools-scm setuptools-rust
          cd python
          cp ../README.md ../LICENSE .
          export SETUPTOOLS_SCM_PRETEND_VERSION="0.0.0.dev0+g$(git rev-parse --short HEAD)"
          python3 -m build --wheel
          ls -lh dist/*.whl

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: sglang-wheel-${{ github.sha }}
          path: python/dist/*.whl
          retention-days: 14
